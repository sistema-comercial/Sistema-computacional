<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistema Comercial - V1 Funcional</title>
<style>
:root{--blue:#2563eb;--dark:#111827;--bg:#f4f6fa;--line:#e5e7eb;--text:#172033}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 30px #0000000d}.loginbox h1{margin:0 0 6px}.muted{color:#64748b;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d6dce5;border-radius:9px;background:#fff}.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:11px 15px;font-weight:700}.btn.gray{background:#eef2f7;color:#273449}.btn.red{background:#dc2626}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--dark);color:#fff;padding:18px 12px;position:fixed;left:0;top:0;bottom:0}.logo{font-size:19px;font-weight:800;padding:8px 10px 20px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--blue);color:#fff}.main{margin-left:235px;flex:1}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}.content{padding:22px;max-width:1250px;margin:auto}.title{font-size:25px;font-weight:800}.sub{color:#64748b;margin:4px 0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.label{color:#64748b;font-size:12px}.value{font-size:24px;font-weight:800;margin-top:5px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.panel h3{margin:0 0 14px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}.search{padding:10px;border:1px solid #d6dce5;border-radius:9px;min-width:240px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eef0f4;font-size:13px}th{font-size:11px;color:#64748b;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#fef3c7;color:#8a5a00;font-size:11px}.ok{background:#dcfce7;color:#166534}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef0f4;font-size:14px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:10px 12px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin:10px 0}.stockcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stockcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stockcard .big{font-size:23px;font-weight:800;margin-top:4px}.stock-actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:7px 9px;font-size:12px}.danger-text{color:#b91c1c}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.status.ok{background:#dcfce7;color:#166534}.status.low{background:#fef3c7;color:#92400e}.status.out{background:#fee2e2;color:#991b1b}.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;padding:10px 12px;font-weight:700;color:#64748b;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.hint{font-size:12px;color:#64748b;margin-top:5px}@media(max-width:800px){.stockcards{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.side{width:100%;height:58px;bottom:auto;padding:7px 8px;display:flex;align-items:center;overflow:auto;z-index:5}.logo{display:none}.nav{display:flex;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:9px}.main{margin-left:0;padding-top:58px}.top{height:58px;padding:0 14px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.content{padding:15px}.title{font-size:22px}}
</style>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="login">
<div class="loginbox">
<h1>🏪 Sistema Comercial</h1><div class="muted">Versão 1 funcional — dados salvos neste dispositivo</div>
<div class="field"><label>Usuário</label><input id="loginUser" value="admin"></div>
<div class="field"><label>Senha</label><input id="loginPass" type="password" value="1234"></div>
<button class="btn" style="width:100%" onclick="login()">Entrar</button>
<div id="loginMsg" class="muted" style="margin-top:10px"></div>
</div></div>

<div id="app" class="app hidden">
<aside class="side"><div class="logo">🏪 SISTEMA COMERCIAL</div><div class="nav">
<button class="active" onclick="go('dashboard',this)">🏠 Dashboard</button>
<button onclick="go('vendas',this)">🛒 Vendas</button>
<button onclick="go('estoque',this)">📦 Estoque</button>
<button onclick="go('clientes',this)">👥 Clientes</button>
<button onclick="go('financeiro',this)">💰 Financeiro</button>
</div></aside>
<main class="main"><header class="top"><b>Minha Empresa</b><span class="muted">Administrador · <button class="btn gray" style="padding:6px 9px" onclick="logout()">Sair</button></span></header><section id="screen" class="content"></section></main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBody"></div></div>

<script>
const KEY='sc_v1_data';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
products:[
{id:1,name:'Camiseta básica',code:'001',cost:30,sale:59.9,stock:25,min:10},
{id:2,name:'Calça jeans',code:'002',cost:45,sale:89.9,stock:7,min:10},
{id:3,name:'Tênis casual',code:'003',cost:80,sale:159.9,stock:0,min:5}
],clients:[{id:1,name:'João Silva',phone:'(99) 99999-9999'},{id:2,name:'Maria Santos',phone:'(99) 98888-8888'}],
sales:[],movements:[],expenses:[],receivables:[]
};
db.products=db.products.map(productDefaults);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function login(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value;if(u==='admin'&&p==='1234'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render('dashboard')}else document.getElementById('loginMsg').textContent='Usuário ou senha inválidos.'}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function go(page,el){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(page)}
function render(page){
if(page==='dashboard')renderDash(); if(page==='estoque')renderStock(); if(page==='vendas')renderSales(); if(page==='clientes')renderClients(); if(page==='financeiro')renderFin();
}
function renderDash(){
let total=db.sales.reduce((s,x)=>s+x.total,0), low=db.products.filter(p=>p.stock<=p.min).length;
document.getElementById('screen').innerHTML=`<div class=title>Dashboard</div><div class=sub>Visão geral da empresa</div>
<div class=cards><div class=card><div class=label>Vendas</div><div class=value>${money(total)}</div></div><div class=card><div class=label>Quantidade de vendas</div><div class=value>${db.sales.length}</div></div><div class=card><div class=label>Produtos</div><div class=value>${db.products.length}</div></div><div class=card><div class=label>Estoque baixo</div><div class=value>${low}</div></div></div>
<div class=grid><div class=panel><h3>Últimas vendas</h3>${db.sales.slice(-5).reverse().map(s=>`<div class=row><span>Venda #${s.id}<br><small>${s.date}</small></span><b>${money(s.total)}</b></div>`).join('')||'<div class=muted>Nenhuma venda ainda.</div>'}</div>
<div class=panel><h3>⚠️ Estoque baixo</h3>${db.products.filter(p=>p.stock<=p.min).map(p=>`<div class=row><span>${p.name}</span><span class=badge>${p.stock} un.</span></div>`).join('')||'<div class=muted>Estoque normal.</div>'}</div></div>`;
}
function productDefaults(p){return Object.assign({category:'',brand:'',unit:'UN',barcode:'',supplier:'',active:true},p)}
function stockStatus(p){if(p.stock<=0)return ['Sem estoque','out'];if(p.stock<=p.min)return ['Estoque baixo','low'];return ['Normal','ok']}
function renderStock(){
 document.getElementById('screen').innerHTML=`<div class=title>📦 Estoque</div><div class=sub>Controle completo de produtos, saldos e movimentações</div>
 <div class=stockcards><div class=stockcard><div class=label>Produtos cadastrados</div><div class=big>${db.products.length}</div></div><div class=stockcard><div class=label>Unidades em estoque</div><div class=big>${db.products.reduce((s,p)=>s+(+p.stock||0),0)}</div></div><div class=stockcard><div class=label>Valor do estoque</div><div class=big>${money(db.products.reduce((s,p)=>s+(+p.stock||0)*(+p.cost||0),0))}</div></div><div class=stockcard><div class=label>Baixo / zerado</div><div class=big>${db.products.filter(p=>p.stock<=p.min).length}</div></div></div>
 <div class=panel><div class=tabs><button id=tabProducts class="tab active" onclick="stockTab('produtos')">Produtos</button><button id=tabMoves class=tab onclick="stockTab('movimentos')">Histórico de movimentações</button></div><div id=stockContent></div></div>`;
 stockTab('produtos');
}
function stockTab(tab){
 document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));document.getElementById(tab==='produtos'?'tabProducts':'tabMoves').classList.add('active');
 if(tab==='produtos') renderStockProducts(); else renderStockMoves();
}
function renderStockProducts(){
 document.getElementById('stockContent').innerHTML=`<div class=toolbar><input class=search id=stockSearch placeholder="🔎 Produto, código ou código de barras" oninput="renderStockTable()"><select class=search id=stockFilter onchange="renderStockTable()"><option value="TODOS">Todos os estoques</option><option value="NORMAL">Normal</option><option value="BAIXO">Estoque baixo</option><option value="ZERADO">Sem estoque</option></select><button class=btn onclick="productModal()">+ Novo produto</button></div><div id=stockTable></div>`;
 renderStockTable();
}
function renderStockTable(){
 const q=(document.getElementById('stockSearch')?.value||'').toLowerCase();const f=document.getElementById('stockFilter')?.value||'TODOS';
 const arr=db.products.filter(p=>{const text=[p.name,p.code,p.barcode||''].join(' ').toLowerCase();const match=text.includes(q);const st=p.stock<=0?'ZERADO':p.stock<=p.min?'BAIXO':'NORMAL';return match&&(f==='TODOS'||f===st)});
 document.getElementById('stockTable').innerHTML=arr.length?`<div class=tablewrap><table><tr><th>Produto</th><th>Código</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Saldo</th><th>Mínimo</th><th>Status</th><th>Ações</th></tr>${arr.map(p=>{const [st,cls]=stockStatus(p);return `<tr><td><b>${p.name}</b><br><small>${p.brand||''}${p.unit?' · '+p.unit:''}</small></td><td>${p.code||'-'}<br><small>${p.barcode||''}</small></td><td>${p.category||'-'}</td><td>${money(p.cost)}</td><td>${money(p.sale)}</td><td><b>${p.stock}</b></td><td>${p.min}</td><td><span class="status ${cls}">${st}</span></td><td><div class=stock-actions><button class="btn gray mini" onclick="moveModal(${p.id})">Movimentar</button><button class="btn gray mini" onclick="editProductModal(${p.id})">Editar</button></div></td></tr>`}).join('')}</table></div>`:'<div class=muted>Nenhum produto encontrado.</div>';
}
function productModal(editId=null){
 const p=editId?db.products.find(x=>x.id===editId):null;const v=k=>p?.[k]??'';
 openModal(`<h2>${p?'Editar produto':'Novo produto'}</h2><div class=field><label>Nome do produto *</label><input id=pname value="${v('name')}"></div><div class=field><label>Código interno</label><input id=pcod value="${v('code')}"></div><div class=field><label>Código de barras</label><input id=pbarcode inputmode=numeric value="${v('barcode')}"></div><div class=field><label>Categoria</label><input id=pcat value="${v('category')}"></div><div class=field><label>Marca</label><input id=pbrand value="${v('brand')}"></div><div class=field><label>Unidade</label><select id=punit><option ${v('unit')==='UN'?'selected':''}>UN</option><option ${v('unit')==='KG'?'selected':''}>KG</option><option ${v('unit')==='CX'?'selected':''}>CX</option><option ${v('unit')==='PCT'?'selected':''}>PCT</option><option ${v('unit')==='M'?'selected':''}>M</option></select></div><div class=field><label>Fornecedor</label><input id=psupplier value="${v('supplier')}"></div><div class=field><label>Preço de custo</label><input id=pcost type=number step=.01 min=0 value="${v('cost')}"></div><div class=field><label>Preço de venda</label><input id=psale type=number step=.01 min=0 value="${v('sale')}"></div><div class=field><label>${p?'Saldo atual':'Estoque inicial'}</label><input id=pstock type=number min=0 value="${p?v('stock'):0}" ${p?'disabled':''}></div><div class=field><label>Estoque mínimo</label><input id=pmin type=number min=0 value="${v('min')||5}"></div><div class=hint>* Campos essenciais. O saldo de um produto existente deve ser alterado em “Movimentar”.</div><div class=actions><button class="btn gray" onclick=closeModal()>Cancelar</button><button class=btn onclick="${p?`updateProduct(${editId})`:'addProduct()'}">Salvar produto</button></div>`);
}
function addProduct(){
 const p={id:Date.now(),name:document.getElementById('pname').value.trim(),code:document.getElementById('pcod').value.trim(),barcode:document.getElementById('pbarcode').value.trim(),category:document.getElementById('pcat').value.trim(),brand:document.getElementById('pbrand').value.trim(),unit:document.getElementById('punit').value,supplier:document.getElementById('psupplier').value.trim(),cost:+document.getElementById('pcost').value||0,sale:+document.getElementById('psale').value||0,stock:+document.getElementById('pstock').value||0,min:+document.getElementById('pmin').value||0,active:true};
 if(!p.name)return alert('Informe o nome do produto.');if(db.products.some(x=>p.code&&x.code===p.code))return alert('Já existe um produto com este código.');db.products.push(p);if(p.stock)db.movements.push({id:Date.now()+1,productId:p.id,type:'ENTRADA',qty:p.stock,date:new Date().toLocaleString('pt-BR'),reason:'Estoque inicial'});save();closeModal();renderStock();
}
function updateProduct(id){const p=db.products.find(x=>x.id===id);if(!p)return;const name=document.getElementById('pname').value.trim(),code=document.getElementById('pcod').value.trim();if(!name)return alert('Informe o nome do produto.');if(db.products.some(x=>x.id!==id&&code&&x.code===code))return alert('Já existe um produto com este código.');Object.assign(p,{name,code,barcode:document.getElementById('pbarcode').value.trim(),category:document.getElementById('pcat').value.trim(),brand:document.getElementById('pbrand').value.trim(),unit:document.getElementById('punit').value,supplier:document.getElementById('psupplier').value.trim(),cost:+document.getElementById('pcost').value||0,sale:+document.getElementById('psale').value||0,min:+document.getElementById('pmin').value||0});save();closeModal();renderStock()}
function editProductModal(id){productModal(id)}
function moveModal(id){let p=db.products.find(x=>x.id===id);openModal(`<h2>Movimentar estoque</h2><div class=notice><b>${p.name}</b><br>Saldo atual: <b>${p.stock} ${p.unit||'UN'}</b></div><div class=field><label>Tipo de movimentação</label><select id=mtype><option value=ENTRADA>Entrada de mercadoria</option><option value=SAIDA>Saída de mercadoria</option><option value=AJUSTE>+ Ajuste</option><option value=AJUSTE_NEG>- Ajuste</option></select></div><div class=field><label>Quantidade</label><input id=mqty type=number min=1 step=.01 inputmode=decimal></div><div class=field><label>Motivo / observação</label><input id=mreason placeholder="Ex.: compra, venda, avaria, inventário..."></div><div class=field><label>Documento / referência</label><input id=mref placeholder="Ex.: NF 12345"></div><div class=actions><button class="btn gray" onclick=closeModal()>Cancelar</button><button class=btn onclick="moveStock(${id})">Confirmar movimentação</button></div>`) }
function moveStock(id){let p=db.products.find(x=>x.id===id),q=+document.getElementById('mqty').value||0,t=document.getElementById('mtype').value;if(!q)return alert('Informe a quantidade.');if((t==='SAIDA'||t==='AJUSTE_NEG')&&q>p.stock)return alert('Estoque insuficiente.');p.stock += (t==='ENTRADA'||t==='AJUSTE'?q:-q);db.movements.push({id:Date.now(),productId:id,type:t,qty:q,date:new Date().toLocaleString('pt-BR'),reason:document.getElementById('mreason').value.trim(),ref:document.getElementById('mref').value.trim()});save();closeModal();renderStock()}
function renderStockMoves(){
 const rows=db.movements.slice().reverse();document.getElementById('stockContent').innerHTML=rows.length?`<div class=toolbar><span class=muted>${rows.length} movimentações registradas</span></div><div class=tablewrap><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th><th>Referência</th><th>Saldo atual</th></tr>${rows.map(m=>{const p=db.products.find(x=>x.id===m.productId);return `<tr><td>${m.date}</td><td>${p?.name||'Produto removido'}</td><td>${m.type}</td><td>${m.type==='SAIDA'||m.type==='AJUSTE_NEG'?'-':''}${m.qty}</td><td>${m.reason||'-'}</td><td>${m.ref||'-'}</td><td>${p?.stock??'-'}</td></tr>`}).join('')}</table></div>`:'<div class=muted>Nenhuma movimentação registrada.</div>';
}
function renderSales(){document.getElementById('screen').innerHTML=`<div class=title>🛒 Vendas / PDV</div><div class=sub>Faça uma venda e o estoque será baixado automaticamente.</div><div class=panel><div class=toolbar><select id=sproduct class=search onchange=updateSalePrice()><option value="">Selecione o produto</option>${db.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${p.name} — ${money(p.sale)} — estoque ${p.stock}</option>`).join('')}</select><input id=sqty class=search type=number min=1 value=1 placeholder="Quantidade"><button class=btn onclick=addSaleItem()>Adicionar</button></div><div id=cart></div></div>`;window.cart=window.cart||[];drawCart()}
function updateSalePrice(){}
function addSaleItem(){let p=db.products.find(x=>x.id==document.getElementById('sproduct').value),q=+document.getElementById('sqty').value||1;if(!p)return;if(q>p.stock)return alert('Quantidade maior que o estoque.');cart.push({productId:p.id,name:p.name,qty:q,price:p.sale});drawCart()}
function drawCart(){let el=document.getElementById('cart');if(!el)return;let total=cart.reduce((s,x)=>s+x.qty*x.price,0);el.innerHTML=cart.length?`<div class=tablewrap><table><tr><th>Produto</th><th>Qtd.</th><th>Valor</th><th>Total</th></tr>${cart.map((x,i)=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)} <button class="btn red" style="padding:5px 8px" onclick="cart.splice(${i},1);drawCart()">×</button></td></tr>`).join('')}</table></div><h3 style=text-align:right>TOTAL: ${money(total)}</h3><div style=text-align:right><button class=btn onclick=finishSale()>Finalizar venda</button></div>`:'<div class=muted>Nenhum produto na venda.</div>'}
function finishSale(){if(!cart.length)return;for(let x of cart){let p=db.products.find(p=>p.id===x.productId);if(x.qty>p.stock)return alert('Estoque mudou e ficou insuficiente.');}let total=cart.reduce((s,x)=>s+x.qty*x.price,0),id=(db.sales.at(-1)?.id||1000)+1;cart.forEach(x=>{let p=db.products.find(p=>p.id===x.productId);p.stock-=x.qty;db.movements.push({id:Date.now()+x.productId,productId:p.id,type:'SAIDA',qty:x.qty,date:new Date().toLocaleString('pt-BR'),saleId:id})});db.sales.push({id,items:cart.map(x=>({...x})),total,date:new Date().toLocaleString('pt-BR')});save();cart=[];alert('Venda finalizada! Estoque atualizado automaticamente.');render('vendas')}
function renderClients(){document.getElementById('screen').innerHTML=`<div class=title>👥 Clientes</div><div class=sub>Clientes cadastrados</div><div class=panel><div class=toolbar><span></span><button class=btn onclick=clientModal()>+ Novo cliente</button></div><div class=tablewrap><table><tr><th>Nome</th><th>Telefone</th></tr>${db.clients.map(c=>`<tr><td>${c.name}</td><td>${c.phone||''}</td></tr>`).join('')}</table></div></div>`}
function clientModal(){openModal(`<h2>Novo cliente</h2><div class=field><label>Nome</label><input id=cname></div><div class=field><label>Telefone / WhatsApp</label><input id=cphone></div><div class=actions><button class="btn gray" onclick=closeModal()>Cancelar</button><button class=btn onclick=addClient()>Salvar</button></div>`)}
function addClient(){if(!document.getElementById('cname').value)return alert('Informe o nome.');db.clients.push({id:Date.now(),name:document.getElementById('cname').value,phone:document.getElementById('cphone').value});save();closeModal();render('clientes')}
function renderFin(){let sales=db.sales.reduce((s,x)=>s+x.total,0),expenses=db.expenses.reduce((s,x)=>s+x.value,0);document.getElementById('screen').innerHTML=`<div class=title>💰 Financeiro</div><div class=sub>Resumo financeiro básico</div><div class=cards><div class=card><div class=label>Entradas por vendas</div><div class=value>${money(sales)}</div></div><div class=card><div class=label>Despesas</div><div class=value>${money(expenses)}</div></div><div class=card><div class=label>Saldo</div><div class=value>${money(sales-expenses)}</div></div><div class=card><div class=label>Vendas</div><div class=value>${db.sales.length}</div></div></div><div class=panel style=margin-top:14px><h3>Movimentações recentes</h3>${db.movements.slice(-10).reverse().map(m=>{let p=db.products.find(x=>x.id===m.productId);return `<div class=row><span>${p?.name||'Produto'} · ${m.type}</span><b>${m.qty}</b></div>`}).join('')||'<div class=muted>Nenhuma movimentação.</div>'}</div>`}
function openModal(x){modalBody.innerHTML=x;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
